apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: mixtral-8x22b-instruct-v01
  namespace: nim-service
spec:
  image:
    repository: nvcr.io/nim/mistralai/mixtral-8x22b-instruct-v01
    tag: latest
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: ngc-api-secret
  storage:
    pvc:
      create: true
      size: "model-size"
      volumeAccessMode: "ReadWriteOnce"
  replicas: 1
  resources:
    limits:
      nvidia.com/gpu: 1
  expose:
    service:
      type: ClusterIP
      port: 8000
