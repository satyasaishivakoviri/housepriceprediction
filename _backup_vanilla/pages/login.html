<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - HomieNest</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module">
        // Strict Auth Redirect: If logged in, go to index immediately
        const initAuthCheck = () => {
            if (window.firebaseHelpers && window.firebaseHelpers.onAuthChange) {
                window.firebaseHelpers.onAuthChange((user) => {
                    if (user) {
                        window.location.replace('index.html');
                    }
                });
            } else {
                setTimeout(initAuthCheck, 50);
            }
        };
        initAuthCheck();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f8fafc",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased min-h-screen flex flex-col">

    <!-- Navbar Minimal - Glaido Style -->
    <nav class="w-full px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="window.history.back()"
                class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors group">
                <span
                    class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">arrow_back_ios_new</span>
            </button>
            <a href="../index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div class="size-8 rounded-lg bg-primary text-white flex items-center justify-center">
                    <span class="material-symbols-outlined text-xl">home_pin</span>
                </div>
                <span class="font-bold text-lg tracking-tight">HomieNest</span>
            </a>
        </div>
        <div class="flex items-center gap-6">
            <div class="hidden sm:flex items-center gap-6 text-sm font-medium">
                <a href="about.html"
                    class="text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">About</a>
                <a href="about.html#faq"
                    class="text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">FAQ</a>
            </div>
            <a href="signup.html"
                class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-primary dark:hover:bg-primary dark:hover:text-white transition-all">
                Sign up
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div
            class="w-full max-w-[400px] bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700 p-8">

            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold mb-2">Welcome Back</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm">Professional real estate insights await you.</p>
            </div>

            <div class="space-y-4">
                <!-- Email -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1.5" for="email">Email
                        Address</label>
                    <input
                        class="w-full rounded-xl border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900/50 p-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
                        id="email" type="email" placeholder="name@company.com" />
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold uppercase text-slate-500"
                            for="password">Password</label>
                        <a href="forgot_password.html" class="text-xs text-primary font-semibold hover:underline">Forgot
                            password?</a>
                    </div>
                    <div class="relative">
                        <input
                            class="w-full rounded-xl border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900/50 p-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
                            id="password" type="password" placeholder="Enter your password" />
                        <button id="toggle-password"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors">
                            <span class="material-symbols-outlined text-lg">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button id="submit-btn"
                    class="w-full bg-primary hover:bg-primary/90 text-white font-bold h-12 rounded-xl mt-2 shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                    Login
                </button>

                <!-- Error/Success Message Container -->
                <div id="error-msg" class="hidden mt-3 p-3 rounded-xl text-sm flex items-start gap-2" role="alert">
                    <span id="error-icon" class="material-symbols-outlined text-lg shrink-0 mt-0.5">error</span>
                    <span id="error-text"></span>
                </div>

                <!-- Divider -->
                <div class="relative py-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-100 dark:border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-[10px] uppercase tracking-wider font-semibold">
                        <span class="bg-white dark:bg-slate-800 px-2 text-slate-400">Or continue with</span>
                    </div>
                </div>

                <!-- Google Button -->
                <button id="google-btn"
                    class="w-full flex items-center justify-center gap-2 h-12 rounded-xl border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors bg-white dark:bg-transparent">
                    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCU_yLNh7SCYXSYQqJeJE6lJCDOlTRtSg6SqC8UOH_IfztMEtO-5tUFmd_TE-7uIHV_t1wXG0BjjFxsvMs-cjslkvNU7N2AhLdsU43GpSLiuu3B-LTARsNo5s1v4FFLzvBDFS8ABPsTkYwLpcMLFWthWMjD-wHrtXN_7am1ZkwRhi6aLcxX1dWL0Od3cX24PxtFM-k3Rz_UWa1Eb9ENOut-Cl6u8DoDsXVcg3aeQU0p_0MaAi0YBLWmOr0_5S-_eepAA5KsPeJFyH8w"
                        alt="Google" class="w-5 h-5" />
                    <span class="text-sm font-semibold">Continue with Google</span>
                </button>
            </div>

            <div class="text-center mt-8">
                <p class="text-xs text-slate-500">New to HomieNest? <a href="signup.html"
                        class="text-primary font-bold hover:underline">Create Account</a></p>
            </div>
        </div>
    </main>

    <!-- Footer Simple -->
    <footer class="p-6 text-center text-[10px] text-slate-400 flex justify-center gap-4">
        <a href="legal.html" class="hover:text-slate-600">Privacy Policy</a>
        <a href="legal.html" class="hover:text-slate-600">Terms of Service</a>
        <a href="#" class="hover:text-slate-600">Support</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submit-btn');
            const googleBtn = document.getElementById('google-btn');
            const errorMsg = document.getElementById('error-msg');
            const togglePassword = document.getElementById('toggle-password');

            // Check if user is already logged in - redirect to dashboard
            if (window.firebaseHelpers) {
                window.firebaseHelpers.onAuthChange((user) => {
                    if (user) {
                        window.location.href = 'dashboard.html';
                    }
                });
            }

            // Check for success message from signup
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('status') === 'account_created') {
                showMessage("Account created successfully! Please check your email to verify, then log in.", 'success');
            }

            // Toggle Password Visibility
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.querySelector('span').textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });

            function showMessage(msg, type = 'error') {
                const errorMsgContainer = document.getElementById('error-msg');
                const errorIcon = document.getElementById('error-icon');
                const errorText = document.getElementById('error-text');

                errorMsgContainer.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700', 'bg-amber-50', 'text-amber-700');

                if (type === 'error') {
                    errorMsgContainer.classList.add('bg-red-50', 'text-red-700');
                    errorIcon.textContent = 'error';
                } else if (type === 'success') {
                    errorMsgContainer.classList.add('bg-green-50', 'text-green-700');
                    errorIcon.textContent = 'check_circle';
                } else if (type === 'warning') {
                    errorMsgContainer.classList.add('bg-amber-50', 'text-amber-700');
                    errorIcon.textContent = 'warning';
                }

                errorText.innerHTML = msg;
            }

            function hideMessage() {
                document.getElementById('error-msg').classList.add('hidden');
            }

            function setLoading(loading) {
                submitBtn.disabled = loading;
                submitBtn.textContent = loading ? "Logging in..." : "Login";
                if (loading) submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span>';
            }

            submitBtn.addEventListener('click', async () => {
                hideMessage();
                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showMessage("Please enter your email and password.");
                    return;
                }

                setLoading(true);
                try {
                    const result = await window.firebaseHelpers.signInWithEmail(email, password);
                    if (result.success) {
                        window.location.href = 'dashboard.html';
                    } else {
                        // Parse Firebase errors into user-friendly messages
                        const error = result.error.toLowerCase();
                        if (error.includes('user-not-found')) {
                            showMessage("No account found with this email. <a href='signup.html' class='underline font-semibold hover:text-red-900'>Create an account</a>", 'warning');
                        } else if (error.includes('wrong-password') || error.includes('invalid-credential')) {
                            showMessage("Incorrect password. Please try again or <a href='forgot_password.html' class='underline font-semibold'>reset your password</a>.");
                        } else if (error.includes('invalid-email')) {
                            showMessage("Please enter a valid email address.");
                        } else if (error.includes('too-many-requests')) {
                            showMessage("Too many failed attempts. Please try again later or reset your password.", 'warning');
                        } else if (error.includes('network')) {
                            showMessage("Network error. Please check your connection and try again.");
                        } else {
                            showMessage("Unable to sign in. Please check your credentials and try again.");
                            console.error('Login error:', result.error);
                        }
                    }
                } catch (e) {
                    console.error(e);
                    showMessage("Something went wrong. Please try again later.");
                } finally {
                    setLoading(false);
                }
            });

            googleBtn.addEventListener('click', async () => {
                try {
                    const result = await window.firebaseHelpers.signInWithGoogle();
                    if (result.success) {
                        window.location.href = 'dashboard.html';
                    } else {
                        const error = result.error.toLowerCase();
                        if (error.includes('unauthorized-domain')) {
                            showMessage("Google Sign In is not configured for this domain. Please use email/password or contact support.", 'warning');
                        } else if (error.includes('popup-closed') || error.includes('cancelled')) {
                            showMessage("Sign in was cancelled. Please try again.", 'warning');
                        } else if (error.includes('popup-blocked')) {
                            showMessage("Pop-up was blocked. Please allow pop-ups for this site and try again.", 'warning');
                        } else {
                            showMessage("Google Sign In failed. Please try again or use email/password.");
                            console.error('Google Sign In error:', result.error);
                        }
                    }
                } catch (e) {
                    console.error(e);
                    showMessage("Something went wrong with Google Sign In. Please try again.");
                }
            });
        });
    </script>
</body>

</html>
