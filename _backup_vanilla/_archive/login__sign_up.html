<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>HomieNest - Login &amp; Sign Up</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d452",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    animation: {
                        'slow-zoom': 'slowZoom 20s ease-in-out infinite alternate',
                        'spin-slow': 'spin 3s linear infinite',
                    },
                    keyframes: {
                        slowZoom: {
                            '0%': { transform: 'scale(1)' },
                            '100%': { transform: 'scale(1.15)' },
                        }
                    }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'Inter', sans-serif;
                min-height: max(884px, 100dvh);
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }.glowing-focus:focus-within {
            box-shadow: 0 0 0 2px rgba(17, 212, 82, 0.1), 0 0 12px 2px rgba(17, 212, 82, 0.25);
            border-color: #11d452 !important;
        }.tab-underline {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }.submit-btn .spinner { display: none; }
        .submit-btn .success-icon { display: none; }
        .submit-btn:active .spinner { display: inline-block; }
        .submit-btn:active span:not(.spinner) { display: none; }.submit-btn.is-success .success-icon { display: flex; }
        .submit-btn.is-success span:not(.success-icon) { display: none; }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#0d1b12] dark:text-white transition-colors duration-300">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <div class="@container w-full">
            <div class="@[480px]:px-4 @[480px]:py-3">
                <div
                    class="relative flex flex-col justify-end overflow-hidden bg-[#102216] @[480px]:rounded-xl min-h-[38vh] shadow-lg">
                    <div class="absolute inset-0 bg-cover bg-center animate-slow-zoom opacity-70 transition-transform duration-1000"
                        style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA5vMko81v1R0jUBPdKs7d8aBDw7cMisW806B4b8qlRlN_F6mxoBZqupfdMcuQ8BKktIQ-J-2Pn9TrwCnTbKxun7amfw5c5Uew7mm1Vbb9AO3XjTSMhBGlchDdR7_181iF34MrjWQW2qGNYsnW8L_aOKBVVXsvv8kpKtCH-hkARRK_U8_DdkuTJd5S85nBqqbpHGAb3F99pFfyflAnTEv-2Y7pGdQsDtDssGrs9BS4n8JJwq4ZYB8jw-OUuJh18izsLNjQ-305hmpiz");'>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-[#102216] via-[#102216]/20 to-transparent"></div>
                    <div class="relative p-6 z-10">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="material-symbols-outlined text-primary text-3xl">home_pin</span>
                            <p class="text-white tracking-tight text-[32px] font-bold leading-tight">HomieNest</p>
                        </div>
                        <p class="text-white/80 text-sm font-medium tracking-wide">AI-Powered Real Estate Insights in
                            India</p>
                    </div>
                </div>
            </div>
        </div>
        <div
            class="flex-1 bg-white dark:bg-background-dark rounded-t-[32px] -mt-8 relative z-10 px-4 pt-8 pb-12 shadow-[0_-20px_50px_-12px_rgba(0,0,0,0.15)]">
            <div class="max-w-[480px] mx-auto mb-8">
                <div class="relative flex border-b border-gray-100 dark:border-white/10">
                    <button
                        class="flex items-center justify-center pb-[13px] pt-2 flex-1 transition-all group active:scale-95">
                        <p class="text-[#0d1b12] dark:text-white text-base font-bold leading-normal tracking-tight">
                            Login</p>
                    </button>
                    <button
                        class="flex items-center justify-center text-gray-400 dark:text-gray-500 pb-[13px] pt-2 flex-1 transition-all group active:scale-95">
                        <p class="text-inherit text-base font-bold leading-normal tracking-tight">Sign Up</p>
                    </button>
                    <div
                        class="tab-underline absolute bottom-0 left-0 h-[3px] w-1/2 bg-primary transform translate-x-0">
                    </div>
                </div>
            </div>
            <div class="max-w-[480px] mx-auto text-center mb-8">
                <h2 class="text-[#0d1b12] dark:text-white text-2xl font-bold leading-tight px-4">Welcome back</h2>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-2 px-6">Access your personalized property
                    valuation dashboard</p>
            </div>
            <div class="max-w-[480px] mx-auto space-y-4">
                <div class="flex flex-col w-full">
                    <p class="text-[#0d1b12] dark:text-gray-300 text-sm font-semibold leading-normal pb-2 ml-1">Email
                        Address</p>
                    <div
                        class="relative glowing-focus rounded-xl border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 transition-all duration-300">
                        <input
                            class="form-input flex w-full border-none bg-transparent rounded-xl text-[#0d1b12] dark:text-white focus:ring-0 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-600 p-[15px] text-base font-normal leading-normal"
                            placeholder="e.g. aditya@homienest.in" type="email" value="" />
                    </div>
                </div>
                <div class="flex flex-col w-full">
                    <div class="flex justify-between items-center pb-2 ml-1">
                        <p class="text-[#0d1b12] dark:text-gray-300 text-sm font-semibold leading-normal">Password</p>
                        <a class="text-primary text-xs font-bold hover:underline" href="#">Forgot?</a>
                    </div>
                    <div
                        class="glowing-focus flex w-full items-stretch rounded-xl border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 transition-all duration-300">
                        <input
                            class="form-input flex w-full min-w-0 flex-1 border-none bg-transparent h-14 text-[#0d1b12] dark:text-white focus:ring-0 placeholder:text-gray-400 dark:placeholder:text-gray-600 p-[15px] text-base font-normal leading-normal"
                            placeholder="Enter your password" type="password" value="" />
                        <button
                            class="text-gray-400 dark:text-gray-500 flex items-center justify-center pr-[15px] hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="pt-4">
                    <button
                        class="submit-btn relative overflow-hidden w-full bg-primary hover:bg-primary/90 active:scale-[0.98] text-white font-bold h-14 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                        <span class="flex items-center gap-2">
                            Continue
                            <span class="material-symbols-outlined text-sm">arrow_forward</span>
                        </span>
                        <span
                            class="spinner absolute animate-spin h-6 w-6 border-2 border-white/30 border-t-white rounded-full"></span>
                        <span class="success-icon flex items-center gap-2">
                            <span class="material-symbols-outlined">check_circle</span>
                            Success
                        </span>
                    </button>
                </div>
                <div class="flex items-center gap-4 py-4">
                    <div class="h-[1px] flex-1 bg-gray-100 dark:bg-white/10"></div>
                    <p class="text-gray-400 dark:text-gray-500 text-xs font-medium uppercase tracking-widest">or</p>
                    <div class="h-[1px] flex-1 bg-gray-100 dark:bg-white/10"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button
                        class="flex items-center justify-center gap-2 h-14 rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/5 hover:border-primary/30 active:scale-95 transition-all">
                        <img alt="Google" class="w-5 h-5"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDMGQua-3nFn5oYlcx_PoiyREhkQVJh2uO04cKTNMPj_vy5dFUxM5mMta-fi_W0Zr7BSFGy4A5fZuDWGt1HwvWFo5DAhCasMkDvYTd5swL2NyJc0rX8gmuerAMzm4jnjHj5HfiCTC8XmP5qfqAKxLgGbeoVr2xR2ucVbOGHZoPD8dlbJK__B-8K5sJPVFORwoF-89WuRdUCUd6HtJTkKo4PmkDO0s63XSdjM7EFrSAufUzbksM9crq07MBtjOTgRPjQbJRrZfNTB2__" />
                        <span class="text-sm font-bold dark:text-white">Google</span>
                    </button>
                    <button
                        class="flex items-center justify-center gap-2 h-14 rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/5 hover:border-primary/30 active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-xl dark:text-white">ios</span>
                        <span class="text-sm font-bold dark:text-white">Apple</span>
                    </button>
                </div>
                <div class="pt-8 text-center space-y-4">
                    <p class="text-gray-400 text-xs px-4 leading-relaxed">
                        By continuing, you agree to HomieNest's <a class="underline hover:text-primary"
                            href="#">Terms</a> and <a class="underline hover:text-primary" href="#">Privacy Policy</a>.
                    </p>
                    <button
                        class="text-primary font-bold text-sm tracking-tight hover:underline active:scale-95 transition-transform">
                        Continue as Guest
                    </button>
                </div>
            </div>
        </div>
        <div class="h-8 bg-white dark:bg-background-dark flex justify-center items-end pb-2">
            <div class="w-32 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full"></div>
        </div>
    </div>

</body>

</html>
