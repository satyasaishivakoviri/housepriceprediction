<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <title>Forgot Password - HomieNest</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { primary: "#0d59f2", "background-light": "#f5f6f8", "background-dark": "#101622" },
                    fontFamily: { display: ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
  <script type="module" crossorigin src="/assets/firebase-config-CDF_MG8Y.js"></script>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4 font-display text-[#0d121c] dark:text-white">
    <div
        class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-800 overflow-hidden">

        <!-- Header -->
        <div class="p-8 pb-6 text-center">
            <div class="flex justify-center mb-6">
                <div
                    class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-16 border-4 border-primary/20 p-1">
                    <div class="w-full h-full rounded-full bg-primary/10 flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined text-3xl">lock_reset</span>
                    </div>
                </div>
            </div>
            <h1 class="text-2xl font-bold mb-2">Forgot Password?</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm">Enter your email and we'll send you a link to reset
                your password.</p>
        </div>

        <div class="px-8 pb-8 space-y-6">
            <!-- Email Input -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1.5" for="email">Email
                    Address</label>
                <input
                    class="w-full rounded-xl border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900/50 p-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
                    id="email" type="email" placeholder="name@company.com" />
            </div>

            <!-- Submit Button -->
            <button id="submit-btn"
                class="w-full bg-primary hover:bg-primary/90 text-white font-bold h-12 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                Send Reset Link
            </button>

            <!-- Status Message -->
            <div id="status-msg" class="hidden p-4 rounded-xl text-center text-sm font-medium"></div>

            <!-- Back to Login -->
            <div class="text-center">
                <a href="login.html"
                    class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-primary font-semibold transition-colors">
                    <span class="material-symbols-outlined text-lg">arrow_back</span>
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');

            submitBtn.addEventListener('click', async () => {
                const email = emailInput.value.trim();

                if (!email) {
                    showStatus("Please enter your email address.", "error");
                    return;
                }

                // UI Loading State
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Sending...';
                statusMsg.classList.add('hidden');

                try {
                    if (window.firebaseHelpers && window.firebaseHelpers.resetPassword) {
                        const result = await window.firebaseHelpers.resetPassword(email);
                        if (result.success) {
                            showStatus(`Reset link sent to <b>${email}</b>.<br>Please check your inbox.`, "success");
                            emailInput.value = ''; // Clear input
                        } else {
                            if (result.error.includes("auth/user-not-found")) {
                                showStatus("No account found with this email.", "error");
                            } else {
                                showStatus("Error: " + result.error, "error");
                            }
                        }
                    } else {
                        showStatus("System error. Please try again later.", "error");
                        console.error("Firebase helpers not loaded");
                    }
                } catch (e) {
                    console.error(e);
                    showStatus("An unexpected error occurred.", "error");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Send Reset Link";
                }
            });

            function showStatus(msg, type) {
                statusMsg.innerHTML = msg;
                statusMsg.className = `p-4 rounded-xl text-center text-sm font-medium border ${type === 'success' ? 'bg-green-50 text-green-700 border-green-100' : 'bg-red-50 text-red-600 border-red-100'}`;
            }
        });
    </script>
</body>

</html>
